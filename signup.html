    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- ==========================
     HEADER
========================== -->

<header>

<nav class="navbar">

<a href="index.html" class="logo">

<img src="images/logo.png"
     alt="BizConnect Logo">

<ul class="nav-menu" id="navMenu">

<!-- ==========================
     SIGN UP SECTION
========================== -->

<section class="signup-page">

<div class="signup-container">

<h2>Create Your BizConnect Account</h2>

<p>

Join thousands of businesses already growing with BizConnect.

</p>

<form id="signupForm">

<div class="input-group">

<i class="fas fa-user"></i>

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

</div>

<div class="input-group">

<i class="fas fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

  <div class="input-group">

    <i class="fas fa-lock"></i>

    <input
    type="password"
    id="password"
    placeholder="Create Password"
    required>

</div>

<div class="input-group">

    <i class="fas fa-lock"></i>

    <input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Password"
    required>

</div>

<div class="terms">

    <label>

        <input
        type="checkbox"
        required>

        I agree to the
        <a href="#">Terms & Conditions</a>

    </label>

</div>

<button
type="submit"
class="signup-button">

<i class="fas fa-user-plus"></i>

Create Account

</button>

<div class="login-link">

Already have an account?

<a href="login.html">

Login Here

</a>

</div>

</form>

</div>

</section>

========================== -->
